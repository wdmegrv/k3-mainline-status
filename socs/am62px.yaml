undescribed:
- device: AM62PX_DEV_OLDI_TX_CORE0/1 (234/235)
  note: the OLDI transmitters; nodes come with the pending AM62P DSS DT patch
- device: AM62PX_DEV_GPMC0 (80), AM62PX_DEV_ELM0 (54)
  note: no GPMC/ELM node on either side; NAND is not available on AM62Px in Linux
- device: AM62PX_DEV_DMASS0_RINGACC_0 (33)
  note: ring accelerator, unused with BCDMA/PKTDMA - fine
- device: AM62PX_DEV_WKUP_TIMER0/1 (110/111)
  note: no wakeup-domain timer nodes on either side; TI's wakeup-sources page names GP timers as a wake source, nothing on lore (?)
- device: AM62PX_DEV_MCRC64_0 (116), AM62PX_DEV_MCU_MCRC64_0 (100)
  note: 64-bit CRC engines; TI's 6.6/6.12 kernels had a driver and a node (crc@30300000), 6.18 and mainline have neither - see the MCRC64 feature row
- device: AM62PX_DEV_DDR32SS0 (170)
  note: the DDR subsystem; TI's 6.12 kernel had the k3-ddr temperature driver and a node (memory-controller@f300000), 6.18 and mainline have neither - see the DDR subsystem feature row
- device: AM62PX_DEV_WKUP_GTC0 (61), AM62PX_DEV_WKUP_ESM0 (64)
  note: firmware territory - fine
- device: AM62PX_DEV_LED0 (83)
  note: unknown block, no node anywhere (?)
sdk:
  version: '12.01'
  page: power management page
  date: '2026-09-29'
  claims:
  - feature: DeepSleep
    upstream: 'yes'
  - feature: MCU Only
    upstream: 'yes'
  - feature: Partial I/O
    upstream: 'yes'
  - feature: I/O Only Plus DDR
    upstream: in progress
    notes: 'Linux: split wkup R5F memory region v9 applied 02.10.2026 (linux-next, v7.4); U-Boot: am62 IO+DDR resume support v9 05.01.2026, bugfixes for AM62P/AM62A v2 10.03.2026 pending'
  - feature: Dynamic Frequency Scaling
    upstream: 'yes'
  - feature: Standby
    upstream: 'no'
    notes: DT idle-state series v1 20.08.2026 open
  - feature: Runtime PM
    upstream: 'yes'
  - feature: Wakeup RTC, WKUP GPIO, USB, WKUP UART
    upstream: yes (DeepSleep, MCU Only)
  - feature: Wakeup Main I/O daisy chain
    upstream: partial
    notes: Main UART yes (k3-am62p5-sk in v7.1), Main GPIO no (TI HACK in pinctrl-single)
  - feature: Wakeup MCU IPC
    upstream: MCU Only
  - feature: Wakeup CAN I/O daisy chain
    upstream: Partial I/O only
    notes: m_can out-of-band wakeup v8 01.10.2026, DT v3 12.09.2026, both open
  remarks:
  - 'Docs cross-check (processor-sdk-doc clone 2026-10-06): of the 33 kernel-driver pages TI builds for AM62PX, two describe drivers no 6.18 kernel has - MCRC64 (CRYPTO_DEV_TI_MCRC64, page last changed
    30.11.2024) and K3 DDR (CONFIG_K3_DDR_TEMP, 09.12.2025); both drivers live in ti-linux-6.12.y only. Jailhouse, UBIFS, NETCONF/YANG, SELinux, fTPM, PQC and the ML runtimes are not SoC components. The
    wakeup-sources page also names GP timers and I2C as wake sources (WKUP_TIMER0/1 undescribed); WKUP I/O daisy chain and RTC I/O are marked not applicable for AM62Px.'
  - 'Other TI pages with upstream statements: Graphics build guide (open-source stack: kernel module since v6.8, firmware in linux-firmware 20231211, Mesa Vulkan experimental, Zink not mainline - the page
    still talks about AXE-1-16M, not AM62Px''s BXS-4-64); the wave5 page only claims V4L2 compliance.'
