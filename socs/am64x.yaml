notes:
- 'Landed in mainline since the TI 6.18 branch point (TI prefixes stale): icssg and am65-cpsw hwtstamp ndo conversion and the rx_filter PTP fix (v6.19), ti-sci-intr per-line interrupt types and the am65-cpsw
  ALE multicast fix (v7.0), icssg HSR multicast FDB and RX classifier macro fix (v7.1), pinctrl ti,am62l-padconf (v7.1), ti_sci IRQ/clock context restore, sci-clk restore_context, BOARDCFG_MANAGED and clk-keystone
  rate caching (v7.2), rti_wdt reaction control (v7.2), icssg AF_XDP fill-ring fix (v7.2), cpufreq ti EPROBE_DEFER (v7.2); the R5F/DSP 48-bit DMA mask is queued in linux-next (v7.4).'
- 'TI-only DT on top of mainline: k3-am64-ti-ipc-firmware.dtsi (R5F/M4F carveouts, mailbox clusters 2/4/6 and main_timer8-11 reserved for the R5F cores) and the EVM/SK overlays k3-am642-eqep.dtso, k3-am642-evm-onboard-clkgen-pcie-serdes.dtso,
  k3-am642-evm-sk-cpsw3g-pps.dtso and k3-am642-sk-pwm.dtso; the timesync router node differs (mux-controller in TI''s tree, pinctrl-single in mainline).'
- 'For the board trackers: fsas (TI_K3_FSS_FSAS=y) and the timesync router mux (MUX_TI_K3_EVENT_ROUTER=m) are vendor-only and enabled on the EVM; SERIAL_8250_PRUSS=m,
  DMABUF_HEAPS_CARVEOUT=y and SRAM_DMA_HEAP=y are TI SDK config options without a mainline driver; everything else the EVM enables is mainline.'
