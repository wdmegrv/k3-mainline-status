- device: AM64X_DEV_DMASS0_RINGACC_0 (33)
  note: ring accelerator, unused with BCDMA/PKTDMA - fine
- device: AM64X_DEV_GTC0 (61)
  note: global timebase counter, firmware territory - fine
- device: AM64X_DEV_FSIRX0-5 (65-70), AM64X_DEV_FSITX0-1 (71-72)
  note: Fast Serial Interface; no node and no Linux driver anywhere, TI drives FSI from the R5F cores - see the FSI feature
- device: AM64X_DEV_LED0 (83)
  note: unknown block, no node anywhere (?)
- device: AM64X_DEV_MCU_MCRC64_0 (100)
  note: 64-bit CRC engine; TI's 6.6/6.12 kernels had a driver and a node, 6.18 and mainline have neither - see the MCRC64 feature
- device: AM64X_DEV_MCU_RTI0 (132)
  note: the MCU-domain RTI (M4F watchdog); no node on either side, M4F firmware territory, where AM62x describes its mcu_rti (?)
- device: AM64X_DEV_DDR16SS0 (138)
  note: the 16-bit DDR subsystem; TI's 6.12 kernel had the k3-ddr temperature driver and a node, 6.18 and mainline have neither - see the DDR subsystem feature
- device: AM64X_DEV_TIMERMGR0 (151)
  note: DMSS timer manager; no node and no Linux driver on either side - fine
sdk:
  version: '12.01'
  page: no upstream-status page for AM64X
  date: '2026-10-06'
  claims: []
  remarks:
  - 'Docs cross-check (processor-sdk-doc clone 2026-10-06): the AM64X docs have no power-management section and no upstream-status page. Of the 34 kernel-driver pages TI builds for AM64X one describes a
    driver no 6.18 kernel has - K3 DDR (CONFIG_K3_DDR_TEMP, page last changed 09.12.2025, driver in ti-linux-6.12.y only). The CPSW pages (Ethernet, CPSW3g, TSN, PTP, EST, CBS, IET, tuning) map to the Ethernet
    feature; the HSR/PRP pages (non-offload, PTP, HSR offload, PRP offload) and the PRU-ICSS driver pages (RemoteProc, ICSSG Ethernet, two-port switch, RPMsg, pruss-uart, XDP) to the PRU-ICSSG feature (the
    pruss-uart page, 14.05.2026, documents the TI-only driver); "IPC for AM64x" to the IPC feature; PCIe root complex, PCIe end point and SERDES to the PCIe feature; ADC, EQEP, PWM, MCAN, VTM, Watchdog,
    QSPI, MMCSD, NAND, USB, Crypto, GPIO, I2C, SPI, UART and DM Timer to their features and components. NETCONF/YANG, UBIFS, SELinux, fTPM, PQC, OP-TEE/ATF, secure boot and the ML runtimes are not SoC components.'
  - 'TI''s upstream statements in the AM64X docs: the two-port switch page says the cut-through configuration interface may change with mainline development (cut-thru is TI-only, not posted); the ICSSG
    Ethernet page refers to an upstream commit for details. No graphics, display or low-power pages exist for AM64x.'
