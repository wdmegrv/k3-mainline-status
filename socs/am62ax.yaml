notes:
- 'Landed in mainline since the TI 6.18 branch point (TI prefixes stale; 57 of the 316 feature patches are found upstream): tidss vblank time (v6.19), davinci-mcasp asynchronous mode, pdir and ifdef cleanup
  (v7.0), am65-cpsw ALE multicast fix (v7.0), k3-am62a7-sk Main UART wakeup, rtc-ti-k3 IO+DDR resume, pinctrl am62l-padconf, davinci-mcasp suspend/resume and aux_div (v7.1), ti_sci IRQ/clock context restore
  and BOARDCFG_MANAGED, clk-keystone rate caching, cpufreq ti EPROBE_DEFER, timer-ti-dm clockevent/clocksource, rti_wdt reaction control, davinci-mcasp audio-graph-card2, j721e-csi2rx multistream, virtual
  channels, runtime PM and system suspend, wave5 packed YUV422, CBP profile, background detection, lock validator and m2m_ctx fixes (v7.2), seven wave5 fixes (v7.3-rc1).'
- 'TI''s AM62A SK overlays in ti-linux-6.18.y that mainline does not have: e3-max-opp, dmtimer-pwm, edgeai (carveout heaps), ethfw (CPSW proxy client), m2-cc3351, mcan, csi2-ox05b1s, fusion, fusion-2, ub954-evm,
  rpi-hdr-ehrpwm; mainline builds k3-am62a7-sk with the k3-am62x-sk csi2-imx219, csi2-ov5640, csi2-tevi-ov5640 and hdmi-audio overlays. The -cicd twin of the branch is at the release branch (0 commits ahead).'
- 'The AM62A support in ti-linux-6.18.y is ahead of a TI release: the public AM62Ax SDK is 11.01.07.05 on ti-linux-6.12.y, so TI''s docs for AM62Ax (MCRC64, K3 DDR pages) still describe the 6.12 kernel.'
