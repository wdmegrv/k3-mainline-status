undescribed:
- device: AM62AX_DEV_CMP_EVENT_INTROUTER0 (1)
  note: compare-event interrupt router (timer compare events); no node in any K3 dtsi on either side, no Linux consumer - fine
- device: AM62AX_DEV_DMASS0_RINGACC_0 (33)
  note: ring accelerator, unused with BCDMA/PKTDMA - fine
- device: AM62AX_DEV_ELM0 (54), AM62AX_DEV_GPMC0 (80)
  note: no GPMC/ELM node on either side; TI's AM62Ax docs have no GPMC NAND page - see the GPMC feature row
- device: AM62AX_DEV_WKUP_GTC0 (61), AM62AX_DEV_WKUP_ESM0 (64)
  note: firmware territory - fine
- device: AM62AX_DEV_LED0 (83)
  note: unknown block, no node anywhere (?)
- device: AM62AX_DEV_MCU_MCRC64_0 (100), AM62AX_DEV_MCRC64_0 (116)
  note: 64-bit CRC engines; TI's 6.6/6.12 kernels had a driver and a node (crc@30300000), 6.18 and mainline have neither - see the MCRC64 feature row
- device: AM62AX_DEV_WKUP_TIMER0/1 (110/111)
  note: no wakeup-domain timer nodes on either side; TI's wakeup-sources page lists WKUP_TIMER0/1 among the wakeup source IDs, nothing on lore (?)
- device: AM62AX_DEV_DDR32SS0 (170)
  note: the DDR subsystem; TI's 6.12 kernel had the k3-ddr temperature driver and a node (memory-controller@f300000, ti,am62a-ddrss), 6.18 and mainline have neither - see the DDR subsystem feature row
- device: AM62AX_DEV_C7X256V0 (207), C7X256V0_CORE0 (209), _CLEC (210), _CLK (211), _DEBUG (212)
  note: the C7x cluster and its sub-devices; the c7x node references the core itself (C7X256V0_C7XV_CORE_0, 208) - fine
- device: AM62AX_DEV_VPAC0 (219)
  note: 'the vision pre-processing accelerator (ISP): no node and no driver on either side, driven by the C7x firmware - see the VPAC feature row'
- device: AM62AX_DEV_HSM0 (225)
  note: HSM M4F, firmware-owned; no node on either side; TI's HSM M4F DT series (v3 14.01.2026) covers AM62P/J722S/J721S2/J784S4, not AM62Ax - fine
sdk:
  version: 12.01 (docs source; not released for AM62Ax)
  page: power management page, AM62AX block of the docs source
  date: '2026-07-31'
  claims:
  - feature: DeepSleep
    upstream: 'yes'
  - feature: MCU Only
    upstream: 'yes'
  - feature: Partial I/O
    upstream: 'yes'
  - feature: I/O Only Plus DDR
    upstream: in progress
    notes: 'Linux: k3-am62a7-sk split R5F memory region v9 applied 02.10.2026 (linux-next, v7.4); U-Boot: am62 IO+DDR resume support v9 05.01.2026 and the AM62P/AM62A bugfixes 10.03.2026 pending'
  - feature: Dynamic Frequency Scaling
    upstream: 'yes'
  - feature: Standby
    upstream: 'no'
    notes: DT idle-state series v1 20.08.2026 open
  - feature: Runtime PM
    upstream: 'yes'
  - feature: Wakeup RTC, WKUP GPIO, USB, WKUP UART
    upstream: yes (DeepSleep, MCU Only)
  - feature: Wakeup Main I/O daisy chain
    upstream: partial
    notes: Main UART yes (k3-am62a7-sk in v7.1), Main GPIO no (TI HACK in pinctrl-single and the DT)
  - feature: Wakeup MCU IPC
    upstream: MCU Only
  - feature: Wakeup CAN I/O daisy chain
    upstream: Partial I/O only, IO+DDR in progress
    notes: m_can out-of-band wakeup v8 01.10.2026, DT v3 12.09.2026, both open
  - feature: Workarounds
    upstream: none needed
    notes: the remoteproc rmmod workaround is listed for AM62x only
  remarks:
  - 'Docs cross-check (processor-sdk-doc clone 2026-10-06, AM62AX TOC at 11.01.07.05): of the 32 kernel-driver pages TI builds for AM62AX, two describe drivers no 6.18 kernel has - MCRC64 (CRYPTO_DEV_TI_MCRC64,
    page last changed 30.11.2024) and K3 DDR (CONFIG_K3_DDR_TEMP, 09.12.2025); both drivers live in ti-linux-6.12.y only. The TSN pages (EST, CBS, IET, tuning) and PTP map to the Ethernet row, CSI2RX to
    Camera, E5010 to JPEG, DSS7 to Display, "Multimedia Video Codec" to VPU, "IPC for AM62ax" to IPC, the power-management pages to the low-power, RTC and thermal rows. There are no graphics pages (no GPU)
    and no PRU pages. NETCONF/YANG, UBIFS, the TPS6594 PMIC, SELinux, fTPM, PQC, OP-TEE/ATF and the Edge AI runtimes are not SoC components. The wakeup-sources page lists WKUP_TIMER0/1 among the wakeup
    source IDs (undescribed) and shows the C7x (am62a-c71_0-fw) and MCU R5F rebooting on resume.'
  - The public AM62Ax docs (11.01.07.05, kernel 6.12.35) have no upstream-status page; the table above is the AM62AX block of the 12.01 docs source, shared with AM62Px and AM62Dx. The E5010 page states
    the driver is in both the TI SDK and upstream; the wave5 page only claims V4L2 compliance.
